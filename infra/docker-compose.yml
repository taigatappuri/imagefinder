services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: imagefinder
      POSTGRES_PASSWORD: imagefinder
      POSTGRES_DB: imagefinder
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagefinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.22
    working_dir: /app
    volumes:
      - ../backend:/app
      - go_mod_cache:/go/pkg/mod
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      FRONTEND_BASE_URL: http://localhost:5173
      DATABASE_URL: postgres://imagefinder:imagefinder@db:5432/imagefinder?sslmode=disable
      DB_AUTO_MIGRATE: "true"
      GO111MODULE: "on"
      GOFLAGS: "-mod=mod"
      SESSION_SECRET: dev-secret
      SESSION_TTL: 168h
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      OPENAI_MODE: mock
      GEMINI_MODE: mock
      GOOGLE_OAUTH_REDIRECT_URL: http://localhost:8080/auth/callback
    command: sh -c "go mod download && go run ./cmd/api"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: golang:1.22
    working_dir: /app
    volumes:
      - ../backend:/app
      - go_mod_cache:/go/pkg/mod
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      FRONTEND_BASE_URL: http://localhost:5173
      DATABASE_URL: postgres://imagefinder:imagefinder@db:5432/imagefinder?sslmode=disable
      DB_AUTO_MIGRATE: "true"
      GO111MODULE: "on"
      GOFLAGS: "-mod=mod"
      SESSION_SECRET: dev-secret
      SESSION_TTL: 168h
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      OPENAI_MODE: mock
      GEMINI_MODE: mock
    command: sh -c "go mod download && go run ./cmd/worker"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
  go_mod_cache:
  frontend_node_modules:
